name: Deploy CropCare demo to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: frontend
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          API_URL: ${{ vars.API_URL }}
        run: |
          BASE="/$REPO_NAME/"
          case "$REPO_NAME" in *.github.io) BASE="/";; esac
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href "$BASE" --dart-define="API_URL=$API_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
