name: cropcare
description: CropCare — Healthy Crops. Better Harvests.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  camera: ^0.11.3
  shared_preferences: ^2.5.3
  http: ^1.5.0
  geolocator: ^14.0.2
  image: ^4.5.4
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu.ttf
  assets:
    - assets/images/
    - assets/data/
    - lib/l10n/
